<style>
:root{
  --deep:#055F7D; --mid:#077FA9; --light:#2DB4D2; --pale:#AAE0E8;
  --green:#27864A; --gd:#53585F; --gm:#7F7F7F; --gl:#C4C7CB; --xl:#E8E8E8; --navy:#1A5276; --black:#1A1A1A;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Tahoma","Geneva",sans-serif;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:#fff;color:var(--gd);font-size:17px;line-height:1.55;font-family:"Tahoma","Geneva",sans-serif;-webkit-font-smoothing:antialiased}
em,i{font-style:normal}
h1,h2,h3,h4{color:var(--deep);font-weight:700;line-height:1.2;margin:0}
h1{font-size:clamp(1.7rem,3.2vw,2.35rem)}
h2{font-size:clamp(1.3rem,2.4vw,1.7rem)}
h3{font-size:1.08rem}
p{margin:0 0 .8em}
button{font-family:inherit}
textarea,input,select{box-sizing:border-box}
:focus-visible{outline:3px solid var(--light);outline-offset:2px}

#app{display:flex;flex-direction:column;height:100%}
.top{flex:none;height:68px;background:var(--deep);color:#fff;display:flex;align-items:center;gap:20px;padding:0 24px}
.top img{height:64px;width:auto;display:block;margin-left:-22px}
.top .crumb{flex:1;font-size:.95rem;color:var(--pale);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb b{color:#fff}
.top .count{font-size:.9rem;color:#fff;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--mid);background:var(--mid);color:#fff;font-weight:700;font-size:.95rem;padding:9px 18px;border-radius:6px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:var(--deep);border-color:var(--deep)}
.btn.sec{background:transparent;color:var(--mid)}
.btn.sec:hover{background:var(--deep);color:#fff;border-color:var(--deep)}
.btn.onDark{background:transparent;border-color:#fff;color:#fff}
.btn.onDark:hover{background:#fff;color:var(--deep);border-color:#fff}
.btn:disabled{opacity:.4;cursor:default;pointer-events:none}
.btn.sm{padding:6px 12px;font-size:.85rem}
#app[data-slide="title"] .top{display:none}

#stage{flex:1;min-height:0;overflow:auto;background:#fff}
.slide{max-width:1240px;margin:0 auto;padding:26px 32px 44px}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mid);margin-bottom:6px}
.lead{font-size:1.15rem;line-height:1.6}
.sh{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.sh .grow{flex:1;min-width:240px}
.rule{height:4px;width:72px;background:var(--light);border-radius:2px;margin:12px 0 0}

.nav{flex:none;display:flex;align-items:center;gap:16px;padding:10px 24px;background:var(--xl);border-top:1px solid var(--gl)}
.nav .prog{flex:1;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.nav .prog button{width:24px;height:10px;border:0;border-radius:3px;background:var(--gl);cursor:pointer;padding:0}
.nav .prog button.seen{background:var(--light)}
.nav .prog button.cur{background:var(--deep)}
.nav .prog button:hover{background:var(--mid)}
.copy{flex:none;padding:6px 24px;background:var(--xl);border-top:1px solid var(--gl);font-size:.78rem;color:var(--gm);text-align:center}

/* Titel */
.title-slide{position:relative;min-height:100%;background:var(--deep);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:56px clamp(24px,8vw,120px)}
.title-slide img{height:112px;width:auto;margin:0 0 40px -14px;align-self:flex-start}
.title-slide h1{color:#fff;font-size:clamp(2.2rem,5.5vw,3.8rem);max-width:900px}
.title-slide .bar{height:6px;width:120px;background:var(--light);margin:26px 0}
.title-slide p.sub{font-size:clamp(1.1rem,2vw,1.5rem);color:#fff;max-width:760px;line-height:1.5}
.title-slide .ovbtn{position:absolute;top:24px;right:24px}
.title-slide .kicker{color:var(--pale);font-size:.95rem;margin:0 0 14px}
.title-slide .kicker .sep{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;vertical-align:middle;margin:0 .5em}
.title-slide .meta{color:var(--pale);font-size:.95rem;margin-top:36px}
.title-slide .cta{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap}

/* Karten */
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{border:1px solid var(--gl);border-radius:8px;padding:20px 22px;background:#fff}
.card h3{margin-bottom:8px}
.card.tint{background:var(--xl);border-color:var(--xl)}
.callout{background:var(--pale);border-left:6px solid var(--mid);border-radius:4px;padding:18px 22px}
.callout h3{margin-bottom:6px}
.stat{font-size:2.3rem;font-weight:700;color:var(--deep);line-height:1}
.pill{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--pale);color:var(--deep)}
.dimlink{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--mid);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.dimlink:hover{color:var(--deep)}

/* Modell */
.model{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:center;margin-top:12px}
.model svg{height:clamp(320px,calc(100vh - 330px),620px);width:auto;max-width:100%;aspect-ratio:1/1;display:block;margin:0 auto}
.seg-g{cursor:pointer;outline:none}
.seg-g .shape{transition:fill .15s}
.panel{border:1px solid var(--gl);border-radius:8px;padding:24px;min-height:300px;background:#fff}
.panel .hint{color:var(--gm)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.85rem;margin-top:14px;color:var(--gd)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .l1::before{background:var(--deep)}
.legend .l2::before{background:var(--pale)}
.legend .l3::before{background:var(--navy)}

/* Dimension */
.dimnum{width:64px;height:64px;border-radius:12px;background:var(--deep);color:#fff;font-size:2rem;font-weight:700;display:grid;place-items:center;flex:none}
.strip{display:flex;gap:6px}
.strip button{width:34px;height:34px;border-radius:6px;border:1px solid var(--gl);background:#fff;color:var(--gd);font-weight:700;cursor:pointer}
.strip button:hover{border-color:var(--mid);color:var(--mid)}
.strip button[aria-current="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--gl);margin:20px 0 22px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 18px;font-size:1rem;font-weight:700;color:var(--gd);cursor:pointer}
.tab:hover{color:var(--mid)}
.tab[aria-selected="true"]{color:var(--deep);border-bottom-color:var(--light)}
.lf{box-sizing:border-box;display:flex;gap:16px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--gl);background:#fff;border-radius:8px;padding:16px 20px;font-size:1.05rem;color:var(--gd);margin-bottom:12px}
.lf .n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--mid);color:#fff;font-weight:700;display:grid;place-items:center}
.lf .q{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.lf .tag{flex:none;margin-left:auto;align-self:flex-start;white-space:nowrap}
.note-s{font-size:.85rem;color:var(--gm)}
#mgrbtn{display:inline-flex;align-items:center;gap:8px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;border-radius:10px;padding:1px 10px;background:var(--gl);color:var(--gd)}
.mrow input[type=checkbox],.savebar input[type=checkbox]{accent-color:var(--green)}
.mgr{margin-top:18px;padding:16px 18px;border:1px solid var(--gl);border-radius:8px;background:#fff}
.mgr h3{margin:0 0 8px}
.mrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--gl);font-size:.98rem;color:var(--gd)}
.mrow label{flex:1 1 auto;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.mrow input[type=checkbox]{margin-top:4px;width:18px;height:18px;flex:none}
.mrow input[type=text]{flex:1 1 auto;min-width:0;padding:7px 10px;border:2px solid var(--gl);border-radius:6px;font:inherit;color:var(--gd)}
.mbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.mbar input[type=text]{flex:1 1 260px;min-width:0;padding:9px 12px;border:2px solid var(--gl);border-radius:6px;font:inherit;font-size:.95rem;color:var(--gd)}
.mwarn{margin:10px 0 0;padding:8px 12px;border-left:4px solid var(--light);background:rgba(170,224,232,.35);font-size:.9rem}
.mwarn.err{border-left-color:#B3261E;color:#B3261E}
.cmp .card.lo{background:var(--xl);border-color:var(--xl)}
.cmp .card.hi{background:rgba(170,224,232,.45);border-color:var(--pale)}
.lvrow{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:18px;align-items:center;padding:14px 18px;border:1px solid var(--gl);border-radius:8px;margin-bottom:10px;background:#fff}
.lvrow:hover{border-color:var(--mid)}
.lvbadge{display:inline-block;padding:6px 12px;border-radius:6px;font-weight:700;font-size:.9rem;text-align:center}
.lvrow .nm{display:block;font-size:.8rem;color:var(--gm);margin-top:4px}
.lvbar{display:flex;gap:3px}
.lvbar i{flex:1;height:10px;border-radius:2px;background:var(--xl)}
.lvbar i.on{background:var(--mid)}

.lv0{--lc:#E8E8E8;--lt:#53585F}
.lv1{--lc:#AAE0E8;--lt:#1A1A1A}
.lv2{--lc:#2DB4D2;--lt:#1A1A1A}
.lv3{--lc:#077FA9;--lt:#FFFFFF}
.lv4{--lc:#055F7D;--lt:#FFFFFF}
.lvbg{background:var(--lc);color:var(--lt)}

/* Skala */
.stairs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.stairs .col{display:flex;flex-direction:column;margin-top:calc((4 - var(--i))*30px);min-width:0}
.stairs .bar{text-align:left;border-radius:8px 8px 0 0;padding:14px 16px;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow-wrap:anywhere}
.stairs .bar b{font-size:1.6rem;line-height:1}
.stairs .bar span{font-size:.95rem;font-weight:700;line-height:1.25}
.stairs .coltext{flex:1;border:1px solid var(--gl);border-top:0;border-radius:0 0 8px 8px;padding:14px 16px;font-size:.98rem;line-height:1.5;background:#fff;overflow-wrap:anywhere}
@media (max-width:1100px){
  .stairs{grid-template-columns:minmax(0,1fr)}
  .stairs .col{margin-top:0}
  .stairs .bar{flex-direction:row;justify-content:flex-start;align-items:baseline;gap:12px;min-height:0;padding:10px 16px}
}

/* Matrix */
.mxwrap{overflow-x:auto}
table.mx{border-collapse:separate;border-spacing:4px;width:100%;min-width:760px;table-layout:fixed}
.mx th.rh{width:22%}
.mx.full th.rh{width:13%}
.mx th{font-size:.85rem;text-align:center;color:var(--deep);padding:6px 4px}
.mx th.rh{text-align:left}
.mx .rowbtn{width:100%;text-align:left;background:var(--xl);border:0;border-radius:6px;padding:10px 12px;font-weight:700;color:var(--deep);font-size:.92rem;cursor:pointer}
.mx .rowbtn:hover{background:var(--pale)}
.mxc{width:100%;min-height:40px;border:2px solid transparent;border-radius:6px;font-weight:700;font-size:1rem;cursor:pointer;background:var(--lc);color:var(--lt)}
.mxc:hover{border-color:var(--black)}
.mxc[aria-pressed="true"]{border-color:var(--black);box-shadow:0 0 0 2px #fff inset}
.mx.full .mxc{background:#fff;color:var(--gd);border:1px solid var(--gl);border-top:6px solid var(--lc);text-align:left;font-weight:400;font-size:.8rem;line-height:1.4;padding:8px 9px;vertical-align:top;min-height:0}
.mx.full .mxc[aria-pressed="true"]{border-color:var(--black);border-top-color:var(--lc)}
.mx.full td{vertical-align:top}
.mxdetail{margin:6px 0 14px}

/* Abgrenzung */
.search{width:100%;max-width:420px;padding:10px 14px;border:2px solid var(--gl);border-radius:6px;font-size:1rem;color:var(--gd);background:#fff}
.search:focus{outline:none;border-color:var(--light)}
table.tb{width:100%;border-collapse:collapse;margin-top:14px}
.tb th{background:var(--deep);color:#fff;text-align:left;padding:10px 14px;font-size:.9rem}
.tb td{padding:12px 14px;vertical-align:top;border-bottom:1px solid var(--xl)}
.tb tr:nth-child(even) td{background:#F4F4F4}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{border:0;border-radius:6px;background:var(--mid);color:#fff;font-weight:700;font-size:.85rem;padding:5px 10px;cursor:pointer}
.tag:hover{background:var(--deep)}

/* Assessment */
.assess{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;margin-top:16px;align-items:start}
.aside{position:sticky;top:12px;max-height:calc(100vh - 150px);overflow:auto;padding-right:4px}
.acard{border:1px solid var(--gl);border-radius:8px;padding:16px 18px;margin-bottom:14px;background:#fff;scroll-margin-top:12px}
.acard.focus{border-color:var(--mid);box-shadow:0 0 0 2px var(--pale)}
.acard h3{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.acard h3 i{flex:none;width:28px;height:28px;border-radius:6px;background:var(--deep);color:#fff;display:grid;place-items:center;font-size:.9rem}
.acols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.acol{min-width:0}
.acol .lbl{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gm);margin-bottom:6px}
.lvs{display:flex;gap:4px}
.lvs button{flex:1 1 0;min-width:0;height:38px;border:1px solid var(--mid);background:#fff;color:var(--mid);font-weight:700;font-size:1rem;border-radius:6px;cursor:pointer;padding:0}
.lvs button:hover{background:var(--pale)}
.acol.ist .lvs button[aria-pressed="true"]{background:var(--mid);color:#fff}
.acol.soll .lvs button{border-color:var(--gd);color:var(--gd)}
.acol.soll .lvs button:hover{background:var(--xl)}
.acol.soll .lvs button[aria-pressed="true"]{background:var(--gd);color:#fff}
.expl{margin-top:8px;padding:10px 12px;border-radius:6px;background:var(--xl);font-size:.88rem;line-height:1.45;min-height:6.6em;overflow-wrap:anywhere}
.expl b{display:block;color:var(--deep);margin-bottom:2px}
.expl.empty{color:var(--gm)}
.acard details{margin-top:10px}
.acard summary{cursor:pointer;font-weight:700;color:var(--deep);font-size:.92rem}
.savebar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 0;padding:14px 16px;border:1px solid var(--gl);border-radius:8px;background:#fff}
.savebar input[type=text]{flex:1 1 240px;min-width:0;padding:9px 12px;border:2px solid var(--gl);border-radius:6px;font:inherit;font-size:.95rem;color:var(--gd);background:#fff}
.savebar input[type=text]:focus{outline:none;border-color:var(--light)}
.savemsg{flex:1 0 100%;font-size:.88rem;color:var(--gd);min-height:1.2em}
.savemsg.err{color:var(--red,#C0392B);font-weight:700}
.savemsg button{margin-left:8px}
details.txt{flex:1 0 100%;min-width:0;max-width:100%}
details.txt summary{cursor:pointer;font-weight:700;color:var(--deep);font-size:.92rem}
details.txt textarea{display:block;width:100%;max-width:100%;min-height:120px;margin-top:8px;border:2px solid var(--gl);border-radius:6px;padding:10px 12px;font:inherit;font-size:.8rem;color:var(--gd);resize:vertical;background:#fff}
.scale{font-size:.85rem;color:var(--gd);background:var(--pale);border-radius:6px;padding:8px 12px;margin-bottom:14px}
.radar{width:100%;max-width:560px;height:auto;display:block;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:10px 0 14px}
.kpi{border:1px solid var(--gl);border-radius:8px;padding:10px 14px}
.kpi small{display:block;color:var(--gm);font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-size:1.6rem;color:var(--deep)}
.gap{display:grid;grid-template-columns:minmax(0,1fr) 120px 36px;gap:10px;align-items:center;font-size:.92rem;margin:4px 0}
.gap .t{height:10px;background:var(--xl);border-radius:3px;overflow:hidden}
.gap .t i{display:block;height:100%;background:var(--deep)}
textarea.note,textarea.res{width:100%;border:2px solid var(--gl);border-radius:6px;padding:10px 12px;font:inherit;font-size:.95rem;color:var(--gd);resize:vertical;background:#fff}
textarea.note:focus,textarea.res:focus{outline:none;border-color:var(--light)}
textarea.res{font-size:.8rem;min-height:170px}
.leg{display:flex;gap:16px;font-size:.82rem;margin-top:6px;justify-content:center}
.leg span::before{content:"";display:inline-block;width:22px;height:0;border-top:3px solid var(--mid);margin-right:6px;vertical-align:4px}
.leg .s::before{border-top:3px dashed var(--gd)}
details.res summary{cursor:pointer;font-weight:700;color:var(--deep);padding:6px 0}

/* Übersicht */
#drawer{position:fixed;inset:0;background:rgba(26,26,26,.6);display:none;z-index:50;padding:24px;overflow:auto}
#drawer.open{display:block}
#drawer .sheet{max-width:1100px;margin:0 auto;background:#fff;border-radius:10px;padding:24px 28px 30px}
#drawer .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:8px 0 18px}
#drawer .tile{text-align:left;border:1px solid var(--gl);background:#fff;border-radius:8px;padding:12px 14px;cursor:pointer;color:var(--gd);font-size:.95rem}
#drawer .tile:hover{border-color:var(--mid)}
#drawer .tile.cur{background:var(--deep);border-color:var(--deep);color:#fff}
#drawer .tile b{display:block;font-size:.75rem;color:var(--mid);margin-bottom:2px}
#drawer .tile.cur b{color:var(--pale)}

@media (max-width:900px){
  .g2,.g3,.model,.assess{grid-template-columns:minmax(0,1fr)}
  .lvrow{grid-template-columns:minmax(0,1fr)}
  .slide{padding:20px 18px 36px}
  .top{padding:0 14px}
  .nav .prog{display:none}
  .nav{justify-content:space-between}
  .acols{grid-template-columns:minmax(0,1fr)}
  .aside{position:static;max-height:none;overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#printrep{display:none}
@media print{
  @page{size:A4;margin:16mm;@bottom-center{content:"© 2026 itonic Advisors. Alle Rechte vorbehalten.";font:8pt Tahoma,Geneva,sans-serif;color:#7F7F7F}}
  html,body{background:#fff!important;height:auto!important;overflow:visible!important}
  body.pr>*:not(#printrep){display:none!important}
  body.pr #printrep{display:block;font-family:"Tahoma","Geneva",sans-serif;color:#53585F;font-size:10pt;line-height:1.4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printrep *{font-style:normal}
  #printrep .pr-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:8pt;border-bottom:3pt solid #2DB4D2}
  #printrep .pr-head img{height:50pt;width:auto;margin-left:-24pt}
  #printrep .pr-date{font-size:9pt;color:#7F7F7F}
  #printrep h1{font-size:19pt;color:#055F7D;margin:14pt 0 2pt;font-weight:700}
  #printrep h2{font-size:12pt;color:#055F7D;margin:10pt 0 6pt;font-weight:700;break-after:avoid}
  #printrep .pr-name{font-size:11pt;margin:0 0 10pt}
  #printrep .pr-kpis{display:flex;gap:8pt;margin:8pt 0}
  #printrep .pr-kpi{flex:1;border:1pt solid #C4C7CB;border-top:3pt solid #077FA9;padding:6pt 8pt;break-inside:avoid}
  #printrep .pr-kpi small{display:block;font-size:8pt;color:#7F7F7F}
  #printrep .pr-kpi b{font-size:15pt;color:#055F7D}
  #printrep .pr-radar{text-align:center;break-inside:avoid}
  #printrep .pr-radar svg{width:100%;max-width:88mm;height:auto}
  #printrep .pr-leg{text-align:center;font-size:9pt;margin-top:2pt}
  #printrep table{width:100%;border-collapse:collapse;font-size:9pt}
  #printrep th{background:#055F7D;color:#fff;text-align:left;padding:5pt 6pt}
  #printrep td{padding:5pt 6pt;border-bottom:1pt solid #C4C7CB;vertical-align:top}
  #printrep tr:nth-child(even) td{background:#AAE0E8}
  #printrep tr{break-inside:avoid}
  #printrep .c{text-align:center;width:34pt}
  #printrep .pr-gap{display:flex;align-items:center;gap:8pt;margin:3pt 0;break-inside:avoid}
  #printrep .pr-gap span:first-child{flex:0 0 150pt}
  #printrep .pr-bar{flex:1;height:7pt;background:#E8E8E8}
  #printrep .pr-bar i{display:block;height:100%;background:#077FA9}
  #printrep .pr-note{font-size:8.5pt;color:#7F7F7F;margin:6pt 0 0}
  #printrep .pr-foot{margin-top:8pt;padding-top:6pt;border-top:1pt solid #C4C7CB;font-size:8pt;color:#7F7F7F}
  #printrep .pr-annex{break-before:page;page-break-before:always}
  #printrep .pr-annex h3{font-size:10.5pt;color:#055F7D;margin:9pt 0 3pt;break-after:avoid}
  #printrep .pr-annex ul{margin:0;padding-left:14pt}
  #printrep .pr-annex li{font-size:9pt;margin:0 0 3pt;break-inside:avoid}
}
/* Druck der aktuellen Folie (Strg+P oder Button „Drucken“); Bericht-Druck siehe body.pr */
#ptabs{display:none}
@page slide{size:A4 landscape;margin:12mm 12mm 16mm;@bottom-center{content:"© 2026 itonic Advisors. Alle Rechte vorbehalten.";font:8pt Tahoma,Geneva,sans-serif;color:#7F7F7F}}
@media print{
  body:not(.pr){-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:13px}
  body:not(.pr) #printrep,body:not(.pr) #drawer,body:not(.pr) .nav,body:not(.pr) .copy,body:not(.pr) .top .btn,body:not(.pr) .top .count,
  body:not(.pr) #stage .btn,body:not(.pr) .title-slide .ovbtn,body:not(.pr) .title-slide .cta,body:not(.pr) .strip,
  body:not(.pr) .tabs,body:not(.pr) .savebar,body:not(.pr) .search,body:not(.pr) .mxwrap + .btn{display:none!important}
  body:not(.pr) #app{page:slide;display:block;height:auto}
  body:not(.pr) .top{height:auto;padding:4px 16px}
  body:not(.pr) .top img{height:44px;margin-left:-14px}
  body:not(.pr) #stage{overflow:visible;height:auto;flex:none}
  body:not(.pr) .slide{max-width:none;padding:14px 0 0}
  body:not(.pr) .title-slide{min-height:160mm;padding:40px 60px}
  .dimlink{text-decoration:none;color:inherit}
  .card,.callout,.lvrow,.acard,.lf,.kpi,.stairs .col,.mx tr,.tb tr{break-inside:avoid}
  .model svg{height:110mm;width:auto}
  .mxwrap{overflow:visible}
  .aside{position:static;max-height:none;overflow:visible}
  .stairs{grid-template-columns:repeat(5,minmax(0,1fr))}
  .stairs .col{margin-top:calc((4 - var(--i))*20px)}
  .stairs .bar{flex-direction:column;justify-content:flex-end;align-items:stretch;gap:2px;min-height:80px;padding:12px 14px}
  /* Dimensionsfolien: alle drei Reiter nacheinander */
  body.ps-dim .tabs,body.ps-dim #tp{display:none!important}
  body.ps-dim #ptabs{display:block}
  #ptabs h2.pt{margin:18px 0 10px;padding-bottom:4px;border-bottom:3px solid var(--light);break-after:avoid}
  #ptabs h2.pt:not(:first-child){break-before:page}
  #ptabs #mgrbtn,#ptabs .mgr,#ptabs .note-s.grow{display:none!important}
}
</style>

{id:1,name:'Culture & Leadership',lines:['Culture &','Leadership'],role:'Rahmen',

{id:2,name:'Strategie & Business Value',lines:['Strategie &','Business Value'],role:'Kerndimension',

{id:3,name:'Governance & Compliance',lines:['Governance &','Compliance'],role:'Kerndimension',

 abgrenzung:'Diese Dimension erfasst Regeln, Rechte und Kontrolle (das „Dürfen“, inkl. regulatorischer Anforderungen an den Datenumgang). Die organisatorische Verankerung der Fähigkeit regelt Dimension 4, die operative Data Governance (Ownership, Qualität, Zugriff) regelt Dimension 8.',

 sichtbar:'Sichtbar wird diese Dimension z. B. daran, ob es einen verbindlichen KI-Leitfaden gibt, ob KI-Anwendungen vor dem produktiven Einsatz nach Risiko eingestuft werden (u. a. nach EU AI Act), und ob klar ist, wer eine KI-Anwendung freigeben darf.',
 niedrig:'Eine niedrige Reife zeigt sich in Ad-hoc-Entscheidungen ohne dokumentierte Regeln.',
 hoch:'Eine hohe Reife zeigt sich in einem etablierten Freigabeprozess mit Risikoklassifizierung, klaren Verantwortlichkeiten und regelmäßiger Überprüfung auf Nachvollziehbarkeit und Bias.',
 stufen:['Keine Regeln, keine Risikobetrachtung, KI wird ungeprüft eingesetzt.','Einzelne, informelle Absprachen zu Leitplanken, kein dokumentierter Freigabeprozess, Risikoklassifizierung fehlt.','Ein KI-Leitfaden sowie Freigabe- und Risikoklassifizierungsprozesse (u. a. mit Blick auf den EU AI Act) sind dokumentiert, werden aber noch nicht durchgängig angewendet.','Freigabeprozesse, Risikoklassifizierung und Guardrails werden durchgängig angewendet und anhand von Kennzahlen (z. B. Audit-Ergebnissen) gesteuert.','Governance-Mechanismen sind bereichsübergreifend verankert, werden kontinuierlich an neue regulatorische Anforderungen angepasst und sind fester Teil des Regelbetriebs.']},
{id:4,name:'Organisation & Operating Model',lines:['Organisation &','Operating Model'],role:'Kerndimension',

{id:5,name:'Rollen & Kompetenzen',lines:['Rollen &','Kompetenzen'],role:'Kerndimension',

{id:6,name:'Produkte & Prozesse',lines:['Produkte &','Prozesse'],role:'Kerndimension',

{id:7,name:'Technologie & Tools',lines:['Technologie &','Tools'],role:'Kerndimension',

var QMAX=400,QPERDIM=30;
var LIB={};            /* eigene Fragen: {dimId:[{id,text}]} */
function newId(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function cleanLib(o){
  /* prüft und bereinigt eine Bibliothek; liefert {lib} oder {err} */
  if(!o||o.format!=='itonic-leitfragen'||!o.fragen||typeof o.fragen!=='object')return {err:'Diese Datei enthält keine Leitfragen für diese Anwendung.'};
  var lib={},seen={};
  for(var d=1;d<=8;d++){
    var arr=Array.isArray(o.fragen[d])?o.fragen[d]:[];lib[d]=[];
    for(var i=0;i<arr.length&&lib[d].length<QPERDIM;i++){
      var q=arr[i],t=q&&typeof q.text==='string'?q.text.replace(/\s+/g,' ').trim().slice(0,QMAX):'';
      if(!t)continue;
      /* Basisfragen bleiben fix: gleicher Wortlaut wie eine Basisfrage wird nicht als eigene Frage übernommen */
      if(DIMS[d-1].leit.some(function(b){return b.toLowerCase().replace(/\s+/g,' ')===t.toLowerCase();}))continue;
      var id=(typeof q.id==='string'&&/^c[A-Za-z0-9_-]{1,40}$/.test(q.id)&&!seen[q.id])?q.id:newId();
      seen[id]=true;lib[d].push({id:id,text:t});
    }
  }
  return {lib:lib};
}
function emptyLib(){var l={};for(var d=1;d<=8;d++)l[d]=[];return l;}
function libObj(){return {format:'itonic-leitfragen',version:1,saved:new Date().toISOString(),fragen:LIB};}

(function initLib(){

function baseQ(d){return d.leit.map(function(t,i){return {id:'b'+(i+1),text:t,basis:true};});}
function allQ(d){return baseQ(d).concat((LIB[d.id]||[]).map(function(q){return {id:q.id,text:q.text,basis:false};}));}
function activeQ(d){
  var all=allQ(d),sel=A.sel[d.id];
  if(!Array.isArray(sel))return all.filter(function(q){return q.basis;});
  return all.filter(function(q){return sel.indexOf(q.id)>-1;});
}
function setActive(d,id,on){
  var cur=activeQ(d).map(function(q){return q.id;}),p=cur.indexOf(id);
  if(on&&p<0)cur.push(id);if(!on&&p>-1)cur.splice(p,1);
  A.sel[d.id]=cur;store.set('itonic-dim-assess-v1',A);
}
function pruneSel(){
  /* entfernt Auswahl-IDs eigener Fragen, die es in der Bibliothek nicht mehr gibt; liefert die Anzahl */
  var n=0;
  DIMS.forEach(function(d){
    var s=A.sel[d.id];if(!Array.isArray(s))return;
    var ids=allQ(d).map(function(q){return q.id;});
    var keep=s.filter(function(x){return ids.indexOf(x)>-1;});
    n+=s.length-keep.length;A.sel[d.id]=keep;
  });

}

    h+='<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px"><p class="note-s grow" style="margin:0">Aktive Leitfragen für diese Standortbestimmung: '+aq.length+' von '+allQ(d).length+'.</p><button type="button" class="btn sec sm" id="mgrbtn" aria-controls="mgr" aria-expanded="'+(!!MGR[d.id])+'">Leitfragen verwalten<svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="'+(MGR[d.id]?'M2 8l4-4 4 4':'M2 4l4 4 4-4')+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>';
    h+=aq.length?aq.map(function(q,i){return '<div class="lf" data-id="'+q.id+'"><span class="n">'+(i+1)+'</span><span class="q">'+esc(q.text)+'</span>'+(q.basis?'<span class="tag">Basis</span>':'')+'</div>';}).join(''):'<p class="note-s">Für diese Dimension ist keine Leitfrage aktiv. Über „Leitfragen verwalten“ kannst Du Fragen auswählen oder ergänzen.</p>';
    if(MGR[d.id])h+=mgrPanel(d);
  }else if(tab==='stand'){
    h+='<div class="callout" style="margin-bottom:20px"><h3>Woran wird Reifegrad sichtbar?</h3><p style="margin:0;font-size:1.05rem">'+esc(d.sichtbar)+'</p></div>'+
       '<div class="grid g2 cmp"><div class="card lo"><div class="eyebrow" style="color:var(--gd)">Niedrige Reife</div><p style="margin:0;font-size:1.05rem">'+esc(d.niedrig)+'</p></div>'+
       '<div class="card hi"><div class="eyebrow">Hohe Reife</div><p style="margin:0;font-size:1.05rem">'+esc(d.hoch)+'</p></div></div>'+
       '<h3 style="margin:26px 0 12px">Reifegradstufen 0–4</h3>';
    h+=d.stufen.map(function(t,i){return '<div class="lvrow"><div><span class="lvbadge lvbg lv'+i+'">Stufe '+i+'</span><span class="nm">'+esc(LEVELS[i])+'</span></div><div>'+esc(t)+'</div><div class="lvbar" aria-hidden="true">'+[0,1,2,3,4].map(function(k){return '<i'+(k<=i?' class="on"':'')+'></i>';}).join('')+'</div></div>';}).join('');
  }
  return h;
}
function renderDim(el,d){
  var tab=TAB[d.id]||'ueberblick';
  var tabs=[['ueberblick','Überblick'],['leit','Leitfragen'],['stand','Reifegrad']];
  el.innerHTML='<div class="slide">'+
   '<div class="sh"><div class="dimnum">'+d.id+'</div><div class="grow"><div class="eyebrow">'+esc(d.role)+'</div><h1>'+esc(d.name)+'</h1></div><button class="btn sec sm" type="button" id="toModel">Zum Modell</button>'+strip(d.id)+'</div>'+
   '<div class="tabs" role="tablist">'+tabs.map(function(t){return '<button type="button" class="tab" role="tab" data-t="'+t[0]+'" aria-selected="'+(t[0]===tab)+'">'+t[1]+'</button>';}).join('')+'</div>'+
   '<div id="tp"></div></div>';
  $('#toModel',el).onclick=function(){go(2);};
  var tp=$('#tp',el);
  function paint(){
    tab=TAB[d.id]||'ueberblick';
    $$('.tab',el).forEach(function(b){b.setAttribute('aria-selected',String(b.getAttribute('data-t')===tab));});
    tp.innerHTML=dimPanel(d,tab);
    var mb=$('#mgrbtn',tp);
    if(mb)mb.onclick=function(){MGR[d.id]=!MGR[d.id];EDITQ=null;MMSG={};paint();};
    var mg=$('#mgr',tp);
    if(mg)bindMgr(mg,d,paint);
  }
  $$('.tab',el).forEach(function(b){b.onclick=function(){TAB[d.id]=b.getAttribute('data-t');paint();};});
  paint();
}

function renderAbgr(el){
  el.innerHTML='<div class="slide">'+
   '<div class="eyebrow">Dimensionen</div><h1>Abgrenzungen: Wohin gehört das Thema?</h1><div class="rule"></div>'+
   '<p class="lead" style="margin:18px 0 14px;max-width:900px">Jedes Thema hat eine führende Dimension. Das vermeidet Doppelzählungen im Assessment.</p>'+
   '<input class="search" id="q" type="search" placeholder="Thema oder Dimension suchen" aria-label="Thema suchen">'+
   '<table class="tb"><thead><tr><th style="width:38%">Thema</th><th style="width:18%">Führende Dimension</th><th>Abgrenzung</th></tr></thead><tbody id="tb"></tbody></table>'+
   '<div class="callout" style="margin-top:22px"><h3>Hinweis zur Skalierung</h3><p style="margin:0">Skalierung ist ein Querschnittsthema und wird bewusst aus drei Perspektiven bewertet — organisatorisch (Dimension 4), prozessual (Dimension 6) und technisch (Dimension 7). Für einzelne Dimensionen können sektorspezifische Anpassungen sinnvoll sein.</p></div></div>';
  var tb=$('#tb',el);
  function paint(){
    var q=($('#q',el).value||'').toLowerCase().trim();
    var rows=ABGR.filter(function(r){
      if(!q)return true;
      var hay=(r.t+' '+r.h+' '+r.d.map(function(n){return 'dimension '+n+' '+dimById(n).name;}).join(' ')).toLowerCase();
      return hay.indexOf(q)>-1;
    });
    tb.innerHTML=rows.length?rows.map(function(r){
      return '<tr><td><b>'+esc(r.t)+'</b></td><td><div class="tags">'+r.d.map(function(n){return '<button class="tag" type="button" data-d="'+n+'" title="'+esc(dimById(n).name)+'">'+n+' · '+esc(dimById(n).lines[0].replace(/ &$/,''))+'</button>';}).join('')+'</div></td><td>'+link(r.h)+'</td></tr>';
    }).join(''):'<tr><td colspan="3">Kein Treffer.</td></tr>';
  }
  $('#q',el).addEventListener('input',paint);
  paint();
}

function renderMatrix(el){
  el.innerHTML='<div class="slide">'+
   '<div class="sh"><div class="grow"><div class="eyebrow">Reifegrad</div><h1>Reifegrad je Dimension</h1><div class="rule"></div></div>'+
   '<button class="btn sec sm" type="button" id="mode"></button></div>'+

   '<div class="card mxdetail" id="mxd"></div><div class="mxwrap"><table class="mx" id="mx"></table></div></div>';
  function paint(){
    var t=$('#mx',el);t.className='mx'+(MX.full?' full':'');
    var h='<thead><tr><th class="rh">Dimension</th>'+LEVELS.map(function(n,i){return '<th>Stufe '+i+'<br><span style="font-weight:400;color:var(--gd)">'+esc(n)+'</span></th>';}).join('')+'</tr></thead><tbody>';
    DIMS.forEach(function(d){
      h+='<tr><td><button class="rowbtn" type="button" data-d="'+d.id+'">'+d.id+' · '+esc(d.name)+'</button></td>';
      d.stufen.forEach(function(s,i){
        var pr=MX.sel&&MX.sel[0]===d.id&&MX.sel[1]===i;
        h+='<td><button type="button" class="mxc lv'+i+'" data-d="'+d.id+'" data-l="'+i+'" aria-pressed="'+(!!pr)+'" title="'+esc(d.name+' – Stufe '+i)+'">'+(MX.full?esc(s):i)+'</button></td>';
      });
      h+='</tr>';
    });
    t.innerHTML=h+'</tbody>';
    $('#mode',el).textContent=MX.full?'Kompaktansicht':'Volltext anzeigen';
    var det=$('#mxd',el);
    if(MX.sel){
      var d=dimById(MX.sel[0]),l=MX.sel[1];
      det.style.display='';
      det.innerHTML='<div class="eyebrow">'+d.id+' · '+esc(d.name)+'</div><h3 style="margin-bottom:8px"><span class="lvbadge lvbg lv'+l+'" style="margin-right:10px">Stufe '+l+'</span>'+esc(LEVELS[l])+'</h3><p style="margin:0;font-size:1.05rem">'+esc(d.stufen[l])+'</p>';
    }else{det.style.display=MX.full?'none':'';det.innerHTML='<p class="note-s" style="margin:0">Keine Zelle gewählt.</p>';}
    $$('.mxc',t).forEach(function(b){b.onclick=function(){MX.sel=[+b.getAttribute('data-d'),+b.getAttribute('data-l')];paint();};});
    $$('.rowbtn',t).forEach(function(b){b.onclick=function(){goDim(b.getAttribute('data-d'));};});
  }
  $('#mode',el).onclick=function(){MX.full=!MX.full;paint();};
  paint();
}

function radarSvg(){
  var W=600,H=470,cx=300,cy=235,R=150,out='<svg class="radar" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Radardiagramm Ist und Soll je Dimension">';

  for(var l=1;l<=4;l++){
    var pts=DIMS.map(function(d,i){return pt(i,l).map(function(x){return x.toFixed(1);}).join(',');}).join(' ');
    out+='<polygon points="'+pts+'" fill="'+(l%2?'#F4F4F4':'#fff')+'" stroke="#C4C7CB" stroke-width="1"/>';
  }
  DIMS.forEach(function(d,i){var p=pt(i,4);out+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="#C4C7CB"/>';});
  for(var k=1;k<=4;k++){out+='<text x="'+(cx+5)+'" y="'+(cy-R*k/4-2)+'" font-size="11" fill="#7F7F7F">'+k+'</text>';}
  function poly(map,stroke,fill,dash){
    var any=DIMS.some(function(d){return map[d.id]!=null;});
    if(!any)return '';
    var pts=DIMS.map(function(d,i){return pt(i,map[d.id]==null?0:map[d.id]).map(function(x){return x.toFixed(1);}).join(',');}).join(' ');
    var s='<polygon points="'+pts+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="3" stroke-linejoin="round"'+(dash?' stroke-dasharray="8 6"':'')+'/>';
    DIMS.forEach(function(d,i){if(map[d.id]!=null){var p=pt(i,map[d.id]);s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="5" fill="'+stroke+'" stroke="#fff" stroke-width="2"/>';}});
    return s;

  out+=poly(A.soll,'#53585F','none',true);

  $('#copy',root).onclick=function(){
    var ta=$('#res',root),msg=$('#copied',root);
    function fb(){try{ta.focus();ta.select();var ok=document.execCommand('copy');msg.textContent=ok?'Kopiert.':'Text markiert: bitte mit Strg+C kopieren.';}catch(e){msg.textContent='Text markiert: bitte mit Strg+C kopieren.';}}
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(function(){msg.textContent='Kopiert.';},fb);}else{fb();}}catch(e){fb();}
  };
  /* Speichern und Laden */
  var prev=null;
  function msg(t,err){var m=$('#smsg',root);m.className='savemsg'+(err?' err':'');m.textContent=t;return m;}
  function exportObj(){
    var lf={};DIMS.forEach(function(d){lf[d.id]=activeQ(d).map(function(q){return {id:q.id,text:q.text,basis:q.basis};});});
    return {format:'itonic-standortbestimmung',version:2,name:A.name||'',saved:new Date().toISOString(),skala:LEVELS,ist:A.ist,soll:A.soll,note:A.note,leitfragen:lf};
  }
  function slug(t){return String(t||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);}
  function parseData(txt){
    var o;try{o=JSON.parse(txt);}catch(e){return {err:'Die Datei konnte nicht gelesen werden, sie ist beschädigt oder hat ein falsches Format.'};}
    if(!o||o.format!=='itonic-standortbestimmung')return {err:'Die Datei stammt nicht aus dieser Unterlage.'};
    function clean(m){var r={};if(m&&typeof m==='object'){for(var d=1;d<=8;d++){var v=m[d];if(typeof v==='number'&&v>=0&&v<=4&&v%1===0)r[d]=v;}}return r;}
    var note={};if(o.note&&typeof o.note==='object'){for(var d=1;d<=8;d++){if(typeof o.note[d]==='string')note[d]=o.note[d].slice(0,2000);}}
    /* Leitfragen (ab Version 2): Auswahl je Dimension; fehlende eigene Fragen werden in die Bibliothek übernommen */
    var sel=null,added=0;
    if(o.leitfragen&&typeof o.leitfragen==='object'){
      sel={};
      DIMS.forEach(function(dm){
        var arr=Array.isArray(o.leitfragen[dm.id])?o.leitfragen[dm.id]:null;
        if(!arr)return;
        var ids=[];
        arr.forEach(function(q){
          if(!q||typeof q.id!=='string')return;
          if(q.basis===true||/^b\d+$/.test(q.id)){if(baseQ(dm).some(function(b){return b.id===q.id;}))ids.push(q.id);return;}
          var t=normQ(q.text);if(!t)return;
          var hit=(LIB[dm.id]||[]).filter(function(x){return x.id===q.id||x.text.toLowerCase()===t.toLowerCase();})[0];
          if(!hit){
            if((LIB[dm.id]||[]).length>=QPERDIM)return;
            hit={id:/^c[A-Za-z0-9_-]{1,40}$/.test(q.id)?q.id:newId(),text:t};
            LIB[dm.id]=(LIB[dm.id]||[]).concat([hit]);added++;
          }
          if(ids.indexOf(hit.id)<0)ids.push(hit.id);
        });
        sel[dm.id]=ids;
      });
      if(added)libSave();
    }
    return {ok:{name:String(o.name||'').slice(0,120),ist:clean(o.ist),soll:clean(o.soll),note:note,sel:sel||{},added:added}};
  }
  function hasData(){return Object.keys(A.ist).length||Object.keys(A.soll).length||Object.keys(A.note).some(function(k){return A.note[k];})||A.name;}
  function apply(o){
    A.name=o.name;A.ist=o.ist;A.soll=o.soll;A.note=o.note;A.sel=o.sel||{};
    store.set('itonic-dim-assess-v1',A);
    $('#aname',root).value=A.name||'';
    $$('textarea[data-note]',root).forEach(function(t){t.value=A.note[t.getAttribute('data-note')]||'';});
    upd();
  }
  function load(txt,label){
    var r=parseData(txt);
    if(r.err){msg(r.err,true);return;}
    prev=hasData()?{name:A.name||'',ist:A.ist,soll:A.soll,note:A.note,sel:A.sel}:null;
    apply(r.ok);
    var m=msg('Geladen'+(label?': '+label:'')+(r.ok.name?' ('+r.ok.name+')':'')+'.'+(r.ok.added?' '+r.ok.added+' eigene Leitfrage(n) in die Bibliothek übernommen (Export empfohlen).':''));
    if(prev){var b=document.createElement('button');b.type='button';b.className='btn sec sm';b.textContent='Rückgängig';b.onclick=function(){apply(prev);prev=null;msg('Vorheriger Stand wiederhergestellt.');};m.appendChild(b);}
  }
  $('#aname',root).addEventListener('input',function(){A.name=this.value;store.set('itonic-dim-assess-v1',A);$('#res',root).value=resultText();});
  $('#fsave',root).onclick=function(){
    var d=new Date(),ds=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    var sl=slug(A.name),fn='itonic-standortbestimmung_'+(sl?sl+'_':'')+ds+'.json';
    try{
      var blob=new Blob([JSON.stringify(exportObj(),null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=u;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(u);},2000);
      msg('Datei erstellt: '+fn+'. Startet kein Download, nutze „Alternativ als Text“.');
    }catch(e){msg('Download nicht möglich. Bitte „Alternativ als Text“ nutzen.',true);}
  };
  $('#fpdf',root).onclick=function(){
    var d=new Date(),ds=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2),
        dd=('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear();
    var sl=slug(A.name),oldT=document.title,
        ai=avg(A.ist),as=avg(A.soll),n=Object.keys(A.ist).filter(function(k){return A.ist[k]!=null;}).length;
    function v(x){return x==null?'–':x;}
    var rows=DIMS.map(function(x){
      var i=A.ist[x.id],s=A.soll[x.id];
      return '<tr><td>'+x.id+' '+esc(x.name)+'</td><td class="c">'+v(i)+'</td><td class="c">'+v(s)+'</td><td class="c">'+(i!=null&&s!=null?s-i:'–')+'</td><td>'+esc(A.note[x.id]||'')+'</td></tr>';
    }).join('');
    var gaps=DIMS.filter(function(x){return A.ist[x.id]!=null&&A.soll[x.id]!=null&&A.soll[x.id]>A.ist[x.id];}).map(function(x){return {d:x,g:A.soll[x.id]-A.ist[x.id]};}).sort(function(a,b){return b.g-a.g;}).slice(0,3);
    var rep=document.getElementById('printrep');
    if(!rep){rep=document.createElement('div');rep.id='printrep';document.body.appendChild(rep);}
    rep.innerHTML='<div class="pr-head">'+'<img alt="itonic advisors" src="'+LOGO_RGB+'">'+'<span class="pr-date">Stand: '+dd+'</span></div>'+
      '<h1>KI-Reifegrad: Standortbestimmung</h1>'+(A.name?'<p class="pr-name">'+esc(A.name)+'</p>':'')+
      '<div class="pr-kpis"><div class="pr-kpi"><small>Ø Ist</small><b>'+(ai==null?'–':de(ai))+'</b></div><div class="pr-kpi"><small>Ø Soll</small><b>'+(as==null?'–':de(as))+'</b></div><div class="pr-kpi"><small>Ist bewertet</small><b>'+n+' / 8</b></div></div>'+
      '<div class="pr-radar">'+radarSvg()+'<div class="pr-leg"><b>—</b> Ist &nbsp;&nbsp; <b>- - -</b> Soll</div></div>'+
      '<h2>Ergebnis je Dimension</h2><table><thead><tr><th>Dimension</th><th class="c">Ist</th><th class="c">Soll</th><th class="c">Lücke</th><th>Notiz</th></tr></thead><tbody>'+rows+'</tbody></table>'+
      '<p class="pr-note">Skala: 0 nicht vorhanden · 1 initial · 2 definiert · 3 etabliert · 4 skaliert/optimiert</p>'+
      '<h2>Größte Lücken (Soll minus Ist)</h2>'+(gaps.length?gaps.map(function(x){return '<div class="pr-gap"><span>'+x.d.id+' · '+esc(x.d.name)+'</span><span class="pr-bar"><i style="width:'+(x.g*25)+'%"></i></span><b>+'+x.g+'</b></div>';}).join(''):'<p class="pr-note">Keine Lücke erfasst.</p>')+
      '<div class="pr-foot">itonic Advisors · KI-Betrachtungsdimensionen</div>'+
      (($('#fpdfq',root)&&$('#fpdfq',root).checked)?'<div class="pr-annex"><h2>Anhang: Leitfragen je Dimension</h2><p class="pr-note" style="margin:0 0 4pt">Verwendete Leitfragen dieser Standortbestimmung.'+(A.name?' '+esc(A.name):'')+'</p>'+
        DIMS.map(function(x){
          var aq=activeQ(x);
          return '<h3>'+x.id+' '+esc(x.name)+'</h3><ul>'+(aq.length?aq.map(function(q){return '<li>'+esc(q.text)+'</li>';}).join(''):'<li>Keine Leitfrage aktiv.</li>')+'</ul>';
        }).join('')+'</div>':'');
    document.title='itonic-standortbestimmung_'+(sl?sl+'_':'')+ds;
    function done(){document.title=oldT;rep.innerHTML='';document.body.classList.remove('pr');window.removeEventListener('afterprint',done);}
    document.body.classList.add('pr');
    window.addEventListener('afterprint',done);
    function doPrint(){
      try{window.print();msg('Druckdialog geöffnet: Ziel „Als PDF speichern“ wählen.');}
      catch(e){done();msg('Drucken nicht möglich. Bitte Browser-Druckfunktion (Strg+P) nutzen.',true);}
    }
    var im=rep.querySelector('.pr-head img');
    if(im&&im.decode){im.decode().then(doPrint,doPrint);}else{doPrint();}
  };
  $('#fopenb',root).onclick=function(){$('#fopen',root).click();};
  $('#fopen',root).addEventListener('change',function(){
    var f=this.files&&this.files[0],inp=this;
    if(!f)return;
    var fr=new FileReader();
    fr.onload=function(){load(String(fr.result),f.name);inp.value='';};
    fr.onerror=function(){msg('Datei konnte nicht gelesen werden.',true);};
    fr.readAsText(f);
  });
  $('#tgen',root).onclick=function(){$('#jtxt',root).value=JSON.stringify(exportObj(),null,2);msg('Text erzeugt. Bitte kopieren und separat ablegen.');};
  $('#tcopy',root).onclick=function(){
    var ta=$('#jtxt',root);if(!ta.value)ta.value=JSON.stringify(exportObj(),null,2);
    function fb(){try{ta.focus();ta.select();var ok=document.execCommand('copy');msg(ok?'Kopiert.':'Text markiert: bitte mit Strg+C kopieren.');}catch(e){msg('Text markiert: bitte mit Strg+C kopieren.');}}
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(function(){msg('Kopiert.');},fb);}else{fb();}}catch(e){fb();}
  };
  $('#tload',root).onclick=function(){var t=$('#jtxt',root).value.trim();if(!t){msg('Bitte zuerst den gespeicherten Text einfügen.',true);return;}load(t,'Text');};
  upd();
}

/* ---------- Navigation ---------- */
var SLIDES=[
 {id:'title',title:'Start',section:'Einführung',render:renderTitle},
 {id:'zweck',title:'Zweck und Aufbau',section:'Einführung',render:renderZweck},
 {id:'modell',title:'Das Modell',section:'Einführung',render:renderModell}
];
DIMS.forEach(function(d){SLIDES.push({id:'dim'+d.id,title:d.id+'. '+d.name,section:'Dimensionen',dim:d.id,render:function(el){renderDim(el,d);}});});
SLIDES.push({id:'abgr',title:'Abgrenzungen',section:'Dimensionen',render:renderAbgr});
SLIDES.push({id:'skala',title:'Reifegradskala',section:'Reifegrad',render:renderSkala});
SLIDES.push({id:'matrix',title:'Reifegrad je Dimension',section:'Reifegrad',render:renderMatrix});
SLIDES.push({id:'assess',title:'Standortbestimmung erstellen',section:'Standortbestimmung',render:renderAssess});

var seen={};
function go(i){
  i=Math.max(0,Math.min(SLIDES.length-1,i));
  cur=i;seen[i]=true;
  var s=SLIDES[i];
  $('#app').setAttribute('data-slide',s.id==='title'?'title':'content');
  stage.innerHTML='';
  s.render(stage);
  stage.scrollTop=0;
  $('#crumb').innerHTML='<b>'+esc(s.section)+'</b> · '+esc(s.title);
  $('#count').textContent=(i+1)+' / '+SLIDES.length;
  $('#btnPrev').disabled=(i===0);
  $('#btnNext').disabled=(i===SLIDES.length-1);
  $$('#prog button').forEach(function(b,k){b.className=(k===i?'cur':(seen[k]?'seen':''));});
  try{history.replaceState(null,'','#'+(i+1));}catch(e){}
}
$('#prog').innerHTML=SLIDES.map(function(s,i){return '<button type="button" title="'+esc(s.title)+'" aria-label="'+esc(s.title)+'" data-i="'+i+'"></button>';}).join('');
$('#prog').addEventListener('click',function(e){var b=e.target.closest('button');if(b)go(+b.getAttribute('data-i'));});
$('#btnPrev').onclick=function(){go(cur-1);};
$('#btnNext').onclick=function(){go(cur+1);};

/* Übersicht */
function buildTiles(){
  var sections=[],map={};
  SLIDES.forEach(function(s,i){if(!map[s.section]){map[s.section]=[];sections.push(s.section);}map[s.section].push(i);});
  $('#tiles').innerHTML=sections.map(function(sec){
    return '<h3 style="margin-top:14px">'+esc(sec)+'</h3><div class="tiles">'+map[sec].map(function(i){return '<button type="button" class="tile'+(i===cur?' cur':'')+'" data-i="'+i+'">'+esc(SLIDES[i].title)+'</button>';}).join('')+'</div>';
  }).join('');
}
function openOv(){buildTiles();$('#drawer').classList.add('open');var t=$('#tiles .tile.cur');if(t)t.focus();}
function closeOv(){$('#drawer').classList.remove('open');}
$('#btnOv').onclick=openOv;
$('#btnClose').onclick=closeOv;
$('#drawer').addEventListener('click',function(e){
  if(e.target.id==='drawer'){closeOv();return;}
  var t=e.target.closest('.tile');if(t){closeOv();go(+t.getAttribute('data-i'));}
});

/* Delegation: Dimensions-Links, Strip, Tags */
document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('.dimlink,.strip button,.tag'):null;
  if(el&&stage.contains(el)){goDim(el.getAttribute('data-d'));}
});

/* Tastatur */
document.addEventListener('keydown',function(e){
  var tg=(e.target&&e.target.tagName)||'';
  if(/INPUT|TEXTAREA|SELECT/.test(tg))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key;
  if($('#drawer').classList.contains('open')){if(k==='Escape'||k==='o'||k==='O'){closeOv();}return;}
  var onBtn=(tg==='BUTTON'||(e.target.getAttribute&&e.target.getAttribute('role')==='button'));
  if(k==='ArrowRight'||k==='PageDown'){e.preventDefault();go(cur+1);}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(cur-1);}
  else if(k===' '&&!onBtn){e.preventDefault();go(cur+1);}
  else if(k==='Home'){e.preventDefault();go(0);}
  else if(k==='End'){e.preventDefault();go(SLIDES.length-1);}
  else if(k==='o'||k==='O'){openOv();}
});

/* Drucken: aktuelle Folie; Dimensionsfolien mit allen drei Reitern (auch bei Strg+P) */
function printExpand(){
  if(document.body.classList.contains('pr'))return;
  var s=SLIDES[cur],d=s.dim?dimById(s.dim):null,tp=$('#tp',stage);
  if(!d||!tp||$('#ptabs',stage))return;
  var box=document.createElement('div');box.id='ptabs';
  box.innerHTML=[['ueberblick','Überblick'],['leit','Leitfragen'],['stand','Reifegrad']].map(function(t){return '<h2 class="pt">'+t[1]+'</h2>'+dimPanel(d,t[0]);}).join('');
  tp.parentNode.insertBefore(box,tp);
  document.body.classList.add('ps-dim');
}
function printCleanup(){
  var b=$('#ptabs',stage);if(b)b.parentNode.removeChild(b);
  document.body.classList.remove('ps-dim');
}
window.addEventListener('beforeprint',printExpand);
window.addEventListener('afterprint',printCleanup);
$('#btnPrint').onclick=function(){window.print();};

var start=0;
try{var h=parseInt((location.hash||'').replace('#',''),10);if(h>=1&&h<=SLIDES.length)start=h-1;}catch(e){}
go(start);
})();
</script>
</body>
